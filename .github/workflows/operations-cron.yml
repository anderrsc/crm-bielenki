name: Operações automáticas (sync WhatsApp)

on:
  schedule:
    # A cada 5 minutos — sync Evolution, watchdog e follow-ups
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Chamar endpoint de operações
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.NEXT_PUBLIC_SITE_URL }}/api/internal/operations")
          echo "HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Endpoint retornou $STATUS"
            exit 1
          fi
